<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc"><title id="title">사업 포트폴리오</title><desc id="desc">기관 유형별 기준을 선택하고, 기존사업 조정과 신규사업 선정을 통합。웹 편집 분류에 따라 원본 방법론의 분석과 의사결정 관계를 정리한 확대용 도식. 실제 고객 수치와 고객명은 포함하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2264a4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b85822"/></marker></defs><rect width="1440" height="1130" fill="#fff"/><text x="40" y="50" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="36" font-weight="700">사업 포트폴리오</text><text x="40" y="85" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">기관 유형별 기준을 선택하고, 기존사업 조정과 신규사업 선정을 통합</text><path d="M40 108 L1400 108" stroke="#cbd8e5" stroke-width="1" fill="none"/><rect x="40" y="130" width="1360" height="36" fill="#2264a4"/><text x="52" y="156" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">분류·관리기준 정립</text><text x="55" y="194" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">공공성</text><text x="280" y="194" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">법정·의무성 / 정책 연계성 / 공공 개입 필요성</text><text x="55" y="226" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">수행방식</text><text x="280" y="226" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">시장구조 / 민간 대체가능성 / 비교우위 / 위탁·협력</text><text x="55" y="258" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">재무·성과</text><text x="280" y="258" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">수익성 / 재무 기여도 / 투자 회수구조 / 재무 위험</text><text x="55" y="290" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">전략적 중요도</text><text x="280" y="290" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">성장·수요 / 핵심역량 연계 / 변화 민감도 / 전략적 파급효과</text><rect x="40" y="310" width="1360" height="39" fill="#fff5ec"/><text x="55" y="337" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">기관 유형에 맞는 평가기준 선택  —  세 평가를 모든 기관에 연속 적용하지 않음</text><text x="40" y="387" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700">준시장형 공기업</text><text x="505" y="387" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700">시장형 공기업</text><text x="970" y="387" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700">준정부기관</text><text x="40" y="424" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">공공성(공적가치) ↑ 높음</text><rect x="40" y="439" width="420" height="142" fill="#eef4fa"/><path d="M250 439 L250 581" stroke="#cbd8e5" stroke-width="1" fill="none"/><path d="M40 510 L460 510" stroke="#cbd8e5" stroke-width="1" fill="none"/><text x="52" y="469" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">효율화·수익개선</text><text x="262" y="469" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">확대·강화·차별화</text><text x="52" y="540" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">구조조정·민간이양</text><text x="262" y="540" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">유지·리스크관리</text><text x="40" y="607" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">낮음     사업성(사업적가치)  → 높음</text><text x="505" y="424" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">전략적 중요도 ↑ 높음</text><rect x="505" y="439" width="420" height="142" fill="#eef4fa"/><path d="M715 439 L715 581" stroke="#cbd8e5" stroke-width="1" fill="none"/><path d="M505 510 L925 510" stroke="#cbd8e5" stroke-width="1" fill="none"/><text x="517" y="469" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">효율화·최적화</text><text x="727" y="469" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">투자확대·고도화</text><text x="517" y="540" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">합리화·사업철수</text><text x="727" y="540" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">육성·시장변화 대응</text><text x="505" y="607" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">낮음     시장경쟁력  → 높음</text><text x="40" y="642" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">국정과제·상위계획 정합성</text><text x="40" y="670.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">사회적 문제해결·형평성</text><text x="40" y="698.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">수익성·성장성 / 운영효율·재무자립</text><text x="505" y="642" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">사업 중단 시 국가 경제·안보 영향은?</text><text x="505" y="670.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">시장에서 독자 생존·성장 가능한가?</text><rect x="970" y="414" width="430" height="79" fill="#eef4fa"/><text x="983" y="439" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">공공성·필요성</text><text x="1155" y="439" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">왜 해야 하는가?</text><text x="983" y="470" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">정책 부합 / 시장실패 / 사회적 파급</text><rect x="970" y="503" width="430" height="79" fill="#eef4fa"/><text x="983" y="528" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">대체불가성</text><text x="1155" y="528" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">왜 우리가 해야 하는가?</text><text x="983" y="559" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">민간경합 / 독점적 지위 타당성</text><rect x="970" y="592" width="430" height="79" fill="#eef4fa"/><text x="983" y="617" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">운영효율성</text><text x="1155" y="617" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">잘하고 있는가?</text><text x="983" y="648" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">투입 대비 성과 / 재무건전성</text><text x="970" y="704" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">사업 특성·역량 검토 → 강화 / 효율화</text><text x="970" y="730.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">이양·개방 / 통폐합·정리 (선택지)</text><path d="M40 756 L1400 756" stroke="#cbd8e5" stroke-width="1" fill="none"/><path d="M890 817 L920 817 L920 920 L945 920" stroke="#2264a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M890 970 L920 970 L920 920" stroke="#2264a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="780" width="850" height="36" fill="#2264a4"/><text x="52" y="806" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">기존사업 평가 → 기존사업 조정방안</text><text x="55" y="846" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">기관 유형별 평가와 조정 선택지를 검토</text><rect x="40" y="887" width="850" height="36" fill="#2264a4"/><text x="52" y="913" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">신규사업·미래과제 발굴 → 사전점검 → 선정평가</text><text x="55" y="952" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">발굴: 정부 정책이행 / 기존사업 연계·확장 / 부서·구성원 제안</text><text x="55" y="980.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">검토: 목적·전략 적합도 / 공공·사회적 가치 / 성장·수익·효율기여</text><text x="55" y="1008.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">         민간경쟁·기능중복</text><rect x="960" y="793" width="440" height="36" fill="#2264a4"/><text x="972" y="819" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">사업 포트폴리오 조정안 (통합)</text><rect x="960" y="842" width="440" height="110" fill="#eef4fa"/><text x="976" y="871" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">사업대상 × 기능</text><text x="976" y="911" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">사업·기능별 조정 비교서식</text><text x="960" y="989" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">확대·강화 / 유지·관리</text><text x="960" y="1018.4" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">이양·전환 / 축소·철수 / 신사업</text><text x="40" y="1106" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400">공기업·준정부기관 적용기준을 함께 제시한 구성 · 조정방안은 검토 선택지이며 확정 결과가 아님</text></svg>