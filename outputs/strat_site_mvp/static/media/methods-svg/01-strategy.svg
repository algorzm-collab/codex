<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc"><title id="title">중장기 경영전략·시나리오</title><desc id="desc">환경분석에서 가치체계·전략목표·실행과제로 연결。웹 편집 분류에 따라 원본 방법론의 분석과 의사결정 관계를 정리한 확대용 도식. 실제 고객 수치와 고객명은 포함하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2264a4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b85822"/></marker></defs><rect width="1440" height="1160" fill="#fff"/><g id="strategy-module-flow" aria-label="분석에서 가치체계·전략목표·실행계획으로 이어지는 아홉 모듈의 진행 흐름"><path d="M470 159 L498 159" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>01→02</title></path><path d="M935 159 L963 159" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>02→03</title></path><path d="M1385 350 L1408 350 L1408 384 L30 384 L30 416 L34 416" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>03→04</title></path><path d="M470 419 L498 419" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>04→05</title></path><path d="M935 419 L963 419" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>05→06</title></path><path d="M1385 627 L1408 627 L1408 647 L30 647 L30 676 L34 676" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>06→07</title></path><path d="M470 679 L498 679" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>07→08</title></path><path d="M935 679 L963 679" stroke="#2264a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><title>08→09</title></path></g><text x="40" y="50" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="36" font-weight="700"