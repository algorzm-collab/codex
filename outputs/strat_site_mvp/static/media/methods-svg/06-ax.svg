<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc"><title id="title">AI·AX</title><desc id="desc">준비도 진단에서 과제선정·실증·확산·성과환류까지 연결。웹 편집 분류에 따라 원본 방법론의 분석과 의사결정 관계를 정리한 확대용 도식. 실제 고객 수치와 고객명은 포함하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2264a4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b85822"/></marker></defs><rect width="1440" height="1280" fill="#fff"/><g id="ax-feedback-destinations" aria-label="성과측정 결과를 데이터·정보구조, 과제선정, 조직·역량설계 각각으로 환류"><path d="M1394 1102 L1422 1102 L1422 414 L28 414" stroke="#b85822" stroke-width="2" fill="none"/><path d="M28 414 L28 435 L34 435" stroke="#b85822" stroke-width="2" fill="none" marker-end="url(#orange)"/><circle cx="37" cy="435" r="2.5" fill="#b85822"/><path d="M378 414 L378 435 L384 435" stroke="#b85822" stroke-width="2" fill="none" marker-end="url(#orange)"/><circle cx="387" cy="435" r="2.5" fill="#b85822"/><path d="M988 414 L988 435 L994 435" stroke="#b85822" stroke-width="2" fill="none" marker-end="url(#orange)"/><circle cx="997" cy="435" r="2.5" fill="#b85822"/></g><text x="40" y="50" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="36" font-weight="700">AI·AX</text><text x="40" y="85" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">준비도 진단에서 과제선정·실증·확산·성과환류까지 연결</text><path d="M40 108 L1400 108" stroke="#cbd8e5" stroke-width="1" fill="none"/><rect x="40" y="128" width="1360" height="36" fill="#2264a4"/><text x="52" y="154" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">Phase 1  전략적 지향점 설정</text><text x="40" y="200" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">01  환경분석·AI 준비도</text><text x="505" y="200" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">02  AX 비전·전략체계</text><text x="970" y="200" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">03  거버넌스·운영기준</text><text x="40" y="237" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">PESTEL: 정책·경제·사회·기술</text><text x="40" y="265.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">환경·법률</text><text x="40" y="293.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">데이터·기술·인력·문화 성숙도</text><text x="40" y="321.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">→ 미래 지향점과의 Gap</text><text x="505" y="237" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">기관 미션·비전 → AX 비전</text><text x="505" y="266.4" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">→ 전략목표 → 성과목표·KPI</text><text x="505" y="295.79999999999995" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">→ AX 과제</text><text x="970" y="237" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">의사결정체계 / 데이터보안 / AI 윤리</text><text x="970" y="263.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">RACI: 실행 R / 책임 A / 협의 C / 공유 I</text><text x="970" y="290.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">위험 대응: 수용 / 감축 / 회피 / 이전</text><rect x="40" y="370" width="1360" height="36" fill="#2264a4"/><text x="52" y="396" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">Phase 2  핵심동인 설계 및 구축</text><text x="40" y="442" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">04  데이터·정보구조</text><text x="40" y="480" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">데이터 자산 맵</text><text x="40" y="509.4" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">→ 통합·품질·보안</text><text x="40" y="538.8" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">→ AI 구동 기반</text><text x="390" y="442" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">05  적용과제 발굴·우선순위</text><text x="390" y="479" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">Top-Down: 공공 가치사슬·정책·전략</text><text x="390" y="505.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">Bottom-Up: 직무·실무자 고충·고객여정</text><text x="390" y="532.2" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">              ↓ 두 관점 합류</text><text x="390" y="558.8000000000001" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">위험·실행가능성 검토 → 과제 후보</text><text x="1000" y="442" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">06  조직·내재화</text><text x="1000" y="480" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">직무별 현재역량 ↔ 필요역량</text><text x="1000" y="508.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">→ 역량 Gap → 교육수요</text><text x="1000" y="536.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">AX 전담기능·조직·직무 설계</text><text x="390" y="607" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">공공가치 ↑ 높음</text><rect x="390" y="622" width="420" height="142" fill="#eef4fa"/><path d="M600 622 L600 764" stroke="#cbd8e5" stroke-width="1" fill="none"/><path d="M390 693 L810 693" stroke="#cbd8e5" stroke-width="1" fill="none"/><text x="402" y="652" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">중장기 핵심</text><text x="612" y="652" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">최우선 추진</text><text x="402" y="723" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">재검토·보류</text><text x="612" y="723" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">여유자원 시 추진</text><text x="390" y="790" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">낮음     실행가능성  → 높음</text><text x="850" y="626" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">공공가치</text><text x="850" y="652.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">정책·전략 정합성 / 시민체감</text><text x="850" y="679.2" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">업무효율 / 포용성·윤리</text><text x="850" y="705.8000000000001" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">실행가능성</text><text x="850" y="732.4000000000001" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">데이터 / 기술 / 법적·보안 적정성</text><text x="850" y="759.0000000000001" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">조직·자원</text><rect x="40" y="825" width="1360" height="75" fill="#fff5ec"/><text x="55" y="851" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">AX 기회 캔버스: 문제·기회 / 사용자 / 가치제안 / AI 역할 / 데이터 / 구현가능성 / 윤리·위험 / KPI / 실행계획</text><text x="55" y="881" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">비즈니스 모델 캔버스를 참조해 AX 과제용으로 재구성</text><rect x="40" y="920" width="1360" height="36" fill="#2264a4"/><text x="52" y="946" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">Phase 3  실행 및 선순환 체계 구축</text><text x="40" y="988" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">07  실행·성과검증</text><text x="505" y="988" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">08  확산·통합</text><text x="970" y="988" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">09  성과관리·지속개선</text><text x="40" y="1026" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">과제 정의·성과목표 → PoC</text><text x="40" y="1054.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">→ 스프린트 검증 → 결과·성과 확인</text><text x="505" y="1026" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">검증된 모델 전사 적용</text><text x="505" y="1054.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">기존 시스템 연계 / 에이전트 협업</text><text x="505" y="1082.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">데이터 연동</text><text x="970" y="1026" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">정량·정성 성과측정 → 개선 → 확산</text><text x="970" y="1054.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">자산: Use Case / AI 모델</text><text x="970" y="1082.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">데이터 / 인적역량</text><text x="930" y="1133" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">과제선정·데이터·역량설계로 환류</text><rect x="40" y="1148" width="1360" height="84" fill="#eef4fa"/><text x="55" y="1176" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">전략수립 과정의 AI 활용  (별도 활용관점)</text><text x="55" y="1208" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">환경 센싱→환경 레이더·미약신호 / 가설·기회→대안·Long-list / 스트레스 테스트→취약점·반작용 보완</text><text x="55" y="1251" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">자원배분 검토→Short-list·배분안 / 실행 추적→트리거 대시보드·조기경보</text></svg>