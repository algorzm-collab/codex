<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">성과관리</title><desc id="desc">성과단계와 책임수준을 구분하고 목표·지표의 적정성을 검토。웹 편집 분류에 따라 원본 방법론의 분석과 의사결정 관계를 정리한 확대용 도식. 실제 고객 수치와 고객명은 포함하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2264a4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b85822"/></marker></defs><rect width="1440" height="1080" fill="#fff"/><text x="40" y="50" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="36" font-weight="700">성과관리</text><text x="40" y="85" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">성과단계와 책임수준을 구분하고 목표·지표의 적정성을 검토</text><path d="M40 108 L1400 108" stroke="#cbd8e5" stroke-width="1" fill="none"/><text x="40" y="153" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700">로직모델로 지표 Pool 구성</text><text x="1015" y="153" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700">경영목표·지표 적정성 평가</text><rect x="40" y="180" width="184" height="36" fill="#2264a4"/><text x="52" y="206" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">투입 Input</text><rect x="226" y="180" width="184" height="36" fill="#2264a4"/><text x="238" y="195" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="700"><tspan x="238" dy="0">과정</tspan><tspan x="238" dy="18">Throughput</tspan></text><rect x="412" y="180" width="184" height="36" fill="#2264a4"/><text x="424" y="206" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">산출 Output</text><rect x="598" y="180" width="184" height="36" fill="#2264a4"/><text x="610" y="206" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">결과 Outcome</text><rect x="784" y="180" width="184" height="36" fill="#2264a4"/><text x="796" y="206" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">영향 Impact</text><rect x="40" y="218" width="184" height="105" fill="#eef4fa"/><text x="50" y="247" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">자원·인력·시간</text><text x="50" y="273.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">·예산</text><text x="50" y="300.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">등 투여한 자산</text><text x="50" y="356" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">무엇을</text><text x="50" y="384.0" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">사용했는가?</text><rect x="40" y="427" width="184" height="125" fill="#eef4fa"/><text x="50" y="458" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">사업수·예산액</text><text x="50" y="484.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">인력·시간</text><rect x="226" y="218" width="184" height="105" fill="#eef4fa"/><text x="236" y="247" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">자원을 활용해</text><text x="236" y="273.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">수행한 활동·절차</text><text x="236" y="356" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">무엇을</text><text x="236" y="384.0" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">했는가?</text><rect x="226" y="427" width="184" height="125" fill="#eef4fa"/><text x="236" y="458" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">실험건수</text><text x="236" y="484.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">교육횟수</text><text x="236" y="511.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">상담건수</text><rect x="412" y="218" width="184" height="105" fill="#eef4fa"/><text x="422" y="247" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">활동의 직접적인</text><text x="422" y="273.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">결과물</text><text x="422" y="356" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">무엇이</text><text x="422" y="384.0" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">나왔는가?</text><rect x="412" y="427" width="184" height="125" fill="#eef4fa"/><text x="422" y="458" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">기술특허 수</text><text x="422" y="484.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">수료생 수</text><text x="422" y="511.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">보고서 수·생산량</text><rect x="598" y="218" width="184" height="105" fill="#eef4fa"/><text x="608" y="247" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">산출물이 만든</text><text x="608" y="273.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">행동·상태 변화</text><text x="608" y="356" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">어떤 변화가</text><text x="608" y="384.0" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">일어났는가?</text><rect x="598" y="427" width="184" height="125" fill="#eef4fa"/><text x="608" y="458" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">사업화 비율</text><text x="608" y="484.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">고용증가율</text><text x="608" y="511.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">기술활용률·성취</text><text x="608" y="537.8000000000001" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">도</text><rect x="784" y="218" width="184" height="105" fill="#eef4fa"/><text x="794" y="247" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">장기적·구조적인</text><text x="794" y="273.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">사회·경제적 변화</text><text x="794" y="356" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">전반적으로 어떤</text><text x="794" y="384.0" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">영향을 줬는가?</text><rect x="784" y="427" width="184" height="125" fill="#eef4fa"/><text x="794" y="458" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">산업기술 경쟁력</text><text x="794" y="484.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">지역소득</text><text x="794" y="511.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">복지 향상</text><text x="40" y="584" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">지표 유형 예시이며 실제 고객의 실적값이 아님</text><text x="1015" y="190" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700">SMART + CC</text><rect x="1015" y="211" width="385" height="66" fill="#eef4fa"/><text x="1025" y="235" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">S 구체성</text><text x="1025" y="262" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">목표가 명확한가</text><rect x="1015" y="283" width="385" height="66" fill="#fff"/><text x="1025" y="307" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">M 측정가능성</text><text x="1025" y="334" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">현재 측정·추산할 수 있는가</text><rect x="1015" y="355" width="385" height="66" fill="#eef4fa"/><text x="1025" y="379" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">A 달성가능성</text><text x="1025" y="406" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">목표의 달성가능성을 검토했는가</text><rect x="1015" y="427" width="385" height="66" fill="#fff"/><text x="1025" y="451" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">R 관련성</text><text x="1025" y="478" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">전략목표와 연결되는가</text><rect x="1015" y="499" width="385" height="66" fill="#eef4fa"/><text x="1025" y="523" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">T 기한 제한</text><text x="1025" y="550" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">달성시점이 정해져 있는가</text><rect x="1015" y="571" width="385" height="66" fill="#fff"/><text x="1025" y="595" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">C 통제가능성</text><text x="1025" y="622" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">평가대상이 영향을 줄 수 있는가</text><rect x="1015" y="643" width="385" height="66" fill="#eef4fa"/><text x="1025" y="667" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="700">C 비교가능성</text><text x="1025" y="694" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">관련 지표와 비교할 수 있는가</text><text x="1015" y="756" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">현행 목표 → 대안 목표 비교</text><text x="1015" y="784.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">→ 목표 재수립</text><text x="1015" y="812.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">현행·대안별로 같은 기준 적용</text><text x="40" y="628" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">책임수준별 차등 적용</text><text x="40" y="665" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">기관(전사)</text><rect x="412" y="670" width="370" height="32" fill="#dbeaf8"/><text x="450" y="694" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">산출·결과 중심</text><text x="40" y="724" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">부서</text><rect x="412" y="729" width="370" height="32" fill="#dbeaf8"/><text x="450" y="753" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">산출·결과 중심</text><text x="40" y="783" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">개인</text><rect x="40" y="788" width="558" height="32" fill="#edf4fb"/><text x="60" y="812" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">투입·과정·산출 중심</text><rect x="798" y="650" width="172" height="161" fill="#fff5ec"/><text x="810" y="683" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">영향</text><text x="810" y="711.0" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">중장기 성과·</text><text x="810" y="739.0" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">가점 적용 검토</text><rect x="40" y="867" width="1360" height="125" fill="#eef4fa"/><text x="55" y="899" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">기관·부서는 주로 산출·결과, 개인은 주로 투입·과정·산출 지표를 적용</text><text x="55" y="928.4" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">산출·결과 측정·관리가 어려우면 투입·과정 활용을 검토하고, 중장기 영향은 별도 반영방식을 검토</text><text x="55" y="976" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">현재 체계 진단 → 지표 Pool → 기준에 따른 선정 → 목표 재수립 → 점검·환류</text><path d="M1335 981 L1335 1015 L651 1015 L651 994" stroke="#b85822" stroke-width="2" fill="none" marker-end="url(#orange)"/><text x="40" y="1056" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400">성과지표 발굴·선정 및 핵심 경영목표 재수립 방법론 · 지표 정의·예시·책임수준·평가기준을 구분</text></svg>