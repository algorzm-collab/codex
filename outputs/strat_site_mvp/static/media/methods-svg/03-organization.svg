<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1190" viewBox="0 0 1440 1190" role="img" aria-labelledby="title desc"><title id="title">조직·적정인력</title><desc id="desc">조직구조 설계와 현재·미래 인력분석을 병렬로 수행하고 개편대안을 판단。웹 편집 분류에 따라 원본 방법론의 분석과 의사결정 관계를 정리한 확대용 도식. 실제 고객 수치와 고객명은 포함하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2264a4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b85822"/></marker></defs><rect width="1440" height="1190" fill="#fff"/><text x="40" y="50" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="36" font-weight="700">조직·적정인력</text><text x="40" y="85" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">조직구조 설계와 현재·미래 인력분석을 병렬로 수행하고 개편대안을 판단</text><path d="M40 108 L1400 108" stroke="#cbd8e5" stroke-width="1" fill="none"/><rect x="40" y="130" width="650" height="36" fill="#2264a4"/><text x="52" y="156" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">조직설계</text><rect x="730" y="130" width="670" height="36" fill="#2264a4"/><text x="742" y="156" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">적정인력 분석</text><text x="55" y="201" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">환경·현안 진단</text><text x="55" y="239" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">외부 PESTi: 정책·경제·사회·기술·산업</text><text x="55" y="267.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">내부 SPROj: 전략·사업·조직·인력·직무</text><text x="55" y="295.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">FGI·구성원 설문 → 조직운영 현안·이슈</text><text x="55" y="354" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">개편 방향성</text><text x="55" y="392" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">개편 목표 + 해결할 현안 → 기준·원칙 → 방향</text><text x="55" y="420.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">전략이행 / 사업변화 / 운영효율 / 통솔범위</text><text x="55" y="448.0" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">유사·중복기능 / 내부통제</text><text x="55" y="506" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">기능·모델·구조 설계</text><rect x="55" y="539" width="620" height="57" fill="#eef4fa"/><text x="66" y="564" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">기능</text><text x="135" y="564" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">효율성 평가 → 통합·강화·축소·폐지·이관 검토</text><rect x="55" y="606" width="620" height="57" fill="#eef4fa"/><text x="66" y="631" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">모델</text><text x="135" y="631" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">업무특성·수행기능 연계 → 모델 선정기준</text><rect x="55" y="673" width="620" height="57" fill="#eef4fa"/><text x="66" y="698" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700">구조</text><text x="135" y="698" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">설계기준 → 수직·수평 분화 → 연계·안정성·통제범위</text><text x="55" y="780" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">→ 조직설계 대안</text><text x="745" y="201" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">현재기준 · 조사와 교정</text><text x="745" y="238" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">부서·직무체계 점검 → 직무·세부업무량 조사</text><text x="745" y="264.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">→ 데이터 교정 → 적정인력 산정 → 단기 과부족 조정</text><text x="745" y="291.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">조사: 부서·개인·직무별 업무량 / 시간·업무비중</text><text x="745" y="317.80000000000007" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">교정: 비정상 데이터 / 조사시점 특이요인</text><text x="745" y="344.4000000000001" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">예정 환경변화 / 경영진·부서 의견</text><rect x="745" y="384" width="640" height="93" fill="#eef4fa"/><text x="758" y="411" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">정원 − 적정인력 = 정원 조정수요</text><text x="758" y="437.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">적정인력 − 현원 = 충원수요</text><text x="758" y="464.20000000000005" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">과잉 → 부족: 인력 재배치 / 부족 → 과잉: 업무 이관</text><text x="745" y="513" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">미래기준 · 핵심동인(KDF)</text><text x="745" y="550" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">전략·운영·직무·재무 요인 → 인력운영 영향요소(DF)</text><text x="745" y="576.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">→ 핵심동인(KDF) 선정 → 직무·부서별 동인 지정</text><text x="745" y="603.2" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">→ 미래 업무량·인력 시나리오</text><text x="745" y="654" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">선정: 영향력·중요도 / 불확실성·예측가능성</text><text x="745" y="680.6" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400">실행·관리가능성 / 측정가능성</text><rect x="745" y="722" width="202" height="49" fill="#eef4fa"/><text x="810" y="754" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400">낙관</text><rect x="963" y="722" width="202" height="49" fill="#eef4fa"/><text x="1028" y="754" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400">중립</text><rect x="1181" y="722" width="202" height="49" fill="#eef4fa"/><text x="1246" y="754" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400">비관</text><path d="M360 804 L360 835 L720 835 L720 855" stroke="#2264a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1060 790 L1060 835 L720 835" stroke="#2264a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="863" width="1360" height="36" fill="#2264a4"/><text x="52" y="889" fill="#fff" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700">단기 조직개편안 A·B / 중장기 조직개편안 A·B → 복수 대안 비교</text><text x="55" y="941" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400">기획·인사 협의 → 구성원·노동조합 의견수렴 → 경영진 검토 → 소관부처 협의 → 이사회 승인</text><text x="55" y="978" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">기관별 의사결정 절차에 맞춰 적용</text><path d="M1380 951 L1417 951 L1417 844 L1090 844 L1090 860" stroke="#b85822" stroke-width="2" fill="none" marker-end="url(#orange)"/><text x="1100" y="829" fill="#b85822" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400">의견 반영·대안 조정</text><rect x="40" y="1002" width="1360" height="111" fill="#eef4fa"/><text x="55" y="1032" fill="#2264a4" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700">조직·인력운영 개선</text><text x="55" y="1067" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">단위조직 R&amp;R / 업무분장 / 직무분류·직무기술서 / 적정인력·인력운영계획</text><text x="55" y="1096.4" fill="#142d4e" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="400">직제·인사규정 / 성과관리·보수 연계</text><text x="40" y="1166" fill="#53677d" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400">조직개편 방안 수립과 적정인력 산정 방법론을 함께 제시한 구성 · 실제 인원수·조직개편 결과를 제시하지 않음</text></svg>